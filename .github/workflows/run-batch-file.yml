name: Run Batch File on Push

on:
  push:
    branches:
      - develop  # This triggers the workflow on push to the 'main' branch

jobs:
  run-batch:
    runs-on: self-hosted  # This will use your local self-hosted runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # This checks out your repo to the runner

      - name: Run custom batch file
        run: |
          echo "Running custom batch file..."
          cd "%GITHUB_WORKSPACE%"  # This changes to the repo's directory
          call my-custom-script.bat  # Run your batch file
